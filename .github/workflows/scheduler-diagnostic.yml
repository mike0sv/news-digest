name: Scheduler diagnostic (temporary)
on:
  schedule:
    # Compare plain UTC with explicit UTC on a fresh workflow registration.
    # Keep registered while observing delayed events; remove after investigation.
    - cron: '3-58/5 * * * *'
    - cron: '4-59/5 * * * *'
      timezone: 'Etc/UTC'
permissions: {}
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Record actual schedule event
        env:
          CRON_EXPRESSION: ${{ github.event.schedule }}
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          print(json.dumps({
              'event': os.environ['GITHUB_EVENT_NAME'],
              'schedule': os.environ['CRON_EXPRESSION'],
              'actor': os.environ['GITHUB_ACTOR'],
              'sha': os.environ['GITHUB_SHA'],
              'started_at_utc': datetime.now(timezone.utc).isoformat(),
          }))
          PY
