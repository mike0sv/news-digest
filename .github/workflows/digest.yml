name: Digest and Pages
on:
  push:
    branches: [main]
    paths-ignore: ['data/**', 'README.md', 'tests/**']
  schedule:
    # 08:17 Europe/London in winter and summer. The earlier winter run is a no-op.
    - cron: '17 7,8 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Day YYYY-MM-DD (empty = today; historical runs do not send Telegram)'
        type: string
        default: ''
      force:
        description: Create an additional edition today
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: digest-and-pages
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Prepare source articles
        id: prepare
        env:
          DIGEST_PROVIDER: ${{ vars.DIGEST_PROVIDER }}
          DIGEST_MODEL: ${{ vars.DIGEST_MODEL }}
          SCHEDULED: ${{ github.event_name == 'schedule' }}
          FORCE: ${{ inputs.force }}
          ISSUE_DATE: ${{ inputs.date }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from digest.pipeline import prepare
          prepare(Path.cwd(), scheduled=os.environ['SCHEDULED'] == 'true',
                  force=os.environ['FORCE'] == 'true', date=os.environ.get('ISSUE_DATE') or None)
          PY
      - name: Install Claude Code when selected
        if: steps.prepare.outputs.needs_model == 'true' && steps.prepare.outputs.provider == 'claude-cli'
        run: npm install --global @anthropic-ai/claude-code
      - name: Curate with Codex
        if: steps.prepare.outputs.needs_model == 'true' && steps.prepare.outputs.provider == 'codex'
        uses: openai/codex-action@54e817e77767f274e7e9ceb9da755fb5c62ce25d # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .runtime/prompt.txt
          output-schema-file: .runtime/schema.json
          output-file: .runtime/result.json
          model: ${{ steps.prepare.outputs.model }}
          sandbox: read-only
          safety-strategy: drop-sudo
          codex-args: '["--ephemeral", "--disable", "shell_tool", "--disable", "apps", "--disable", "plugins", "--disable", "browser_use", "-c", "web_search=\"disabled\""]'
      - name: Generate and validate issue
        if: steps.prepare.outputs.ready == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          python - <<'PY'
          from pathlib import Path
          from digest.pipeline import generate_issue, read_json
          root = Path.cwd()
          job = read_json(root / '.runtime/job.json')
          result = root / '.runtime/result.json'
          external = result if job['config']['provider'] == 'codex' and job['candidates'] else None
          if external and not result.exists():
              raise SystemExit('Codex produced no output; refusing an implicit fallback')
          generate_issue(root, response_file=external)
          PY
      - name: Publish full issues for Instant View
        env:
          TELEGRAPH_ACCESS_TOKEN: ${{ secrets.TELEGRAPH_ACCESS_TOKEN }}
          DIGEST_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python -m digest instant-view
      - name: Build public archive
        run: python -m digest build
      - name: Upload persistent state
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digest-state
          path: data/
          retention-days: 1
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site/
          retention-days: 1
  persist:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: digest-state
          path: data/
      - name: Save archive before attempting delivery
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m 'Update digest archive and state'
            git push origin HEAD:main
          fi
  deploy:
    needs: persist
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy archive
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
  deliver:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Deliver pending issue
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DIGEST_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python -m digest deliver
      - name: Save delivery receipt
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m 'Record digest delivery'
            git push origin HEAD:main
          fi
